{{ define "main" -}}
<section class="row td-search-result">
<div class="col-12 col-md-8 offset-md-2 text-center py-5">
  <h2>{{ .Title }}</h2>
  <p class="lead mt-3">Use the search bar in the navigation or press <kbd>Ctrl</kbd>+<kbd>K</kbd> to search.</p>
  <button type="button" class="btn btn-primary mt-3" onclick="document.getElementById('search-modal').open()">
    <i class="fas fa-search me-1"></i> Open Search
  </button>
</div>
</section>
{{ end }}
